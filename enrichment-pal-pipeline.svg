<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="100%">
  <title>Enrichment Pal pipeline</title>
  <desc>Student request, intent router, fixed knowledge base, grounded answer</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="80" width="130" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="105" y="106" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Student request</text>
  <text x="105" y="126" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">natural-language</text>
  <text x="105" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">campus-life question</text>
  <rect x="197" y="80" width="130" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="262" y="106" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489">Intent router</text>
  <text x="262" y="126" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#534AB7">route to one of six</text>
  <text x="262" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#534AB7">fixed modules</text>
  <rect x="353" y="80" width="130" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="418" y="106" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Knowledge base</text>
  <text x="418" y="126" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">official snapshots,</text>
  <text x="418" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0F6E56">URL + retrieval date</text>
  <rect x="510" y="80" width="130" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="575" y="106" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">Grounded answer</text>
  <text x="575" y="126" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#854F0B">answer + citation</text>
  <text x="575" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#854F0B">+ boundary notices</text>
  <line x1="170" y1="122" x2="193" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="327" y1="122" x2="349" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="483" y1="122" x2="506" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="196" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="216" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Fixed sources: uhs.hku.hk · cse.hku.hk · estates.hku.hk (shuttle and catering) · locker pages · CEDARS / OSH</text>
  <text x="340" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#5F5E5A">One curated snapshot per module, each entry stored with its source URL and retrieval date</text>
</svg>
